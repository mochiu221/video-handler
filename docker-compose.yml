services:

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: video-handler
      RABBITMQ_DEFAULT_PASS: video-handler-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - video-handler-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # mem_limit: 512m
    # cpus: 0.5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - video-handler-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: video-handler
      MINIO_ROOT_PASSWORD: video-handler-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - video-handler-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1
    restart: unless-stopped

  video-handler-client:
    build:
      context: ./video-handler-client
    ports:
      - "4200:80"
    depends_on:
      video-handler-server:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  video-handler-worker:
    build:
      context: .
      dockerfile: ./video-handler-worker/Dockerfile
    environment:
      RABBITMQ_URL: amqp://video-handler:video-handler-dev@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_BUCKET: video-handler
      MINIO_ACCESS_KEY: video-handler
      MINIO_SECRET_KEY: video-handler-dev
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    init: true
    restart: unless-stopped

  video-handler-server:
    build:
      context: ./video-handler-server
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      RABBITMQ_URL: amqp://video-handler:video-handler-dev@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_BUCKET: video-handler
      MINIO_ACCESS_KEY: video-handler
      MINIO_SECRET_KEY: video-handler-dev
    volumes:
      - video-handler-uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  video-handler-uploads:
  video-handler-rabbitmq:
  video-handler-redis:
  video-handler-minio: